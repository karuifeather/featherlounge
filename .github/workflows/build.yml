name: FeatherLounge build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: '34'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build:
    name: Build FeatherLounge APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Check JavaScript syntax
        run: for f in assets/*.js; do node --check "$f"; done

      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Release builds need the ANDROID_KEYSTORE_BASE64 secret (see docs/building.md)."
              exit 1
            fi
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -storepass android -keypass android \
              -alias featherlounge -dname "CN=FeatherLounge CI" -keyalg RSA -keysize 2048 -validity 1000
            echo "path=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_OUTPUT"
            echo "persistent=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets set: using a throwaway key. This APK cannot update an installed release build."
          fi

      - name: Build FeatherLounge APK
        env:
          KEYSTORE: ${{ steps.key.outputs.path }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'featherlounge' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          BUILD_TOOLS: ${{ env.ANDROID_BUILD_TOOLS }}
          PLATFORM: ${{ env.ANDROID_PLATFORM }}
          APK_NAME: FeatherLounge.apk
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          VERSION_NAME="${VERSION_NAME#v}" ./build.sh

      - name: Upload FeatherLounge APK
        uses: actions/upload-artifact@v7
        with:
          name: FeatherLounge-apk
          path: FeatherLounge.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish FeatherLounge release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: FeatherLounge-apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A versioned copy for the record, and a fixed name so .../releases/latest/download/FeatherLounge.apk never changes.
          cp FeatherLounge.apk "FeatherLounge-${TAG}.apk"
          gh release create "$TAG" "FeatherLounge-${TAG}.apk" FeatherLounge.apk \
            --repo "$GITHUB_REPOSITORY" --title "FeatherLounge ${TAG}" --generate-notes
